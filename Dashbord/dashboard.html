<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="dash.js"></script>
    <title>Tela Inicial</title>
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <h2>Dashboard</h2>
        <nav>
          <ul class="menu">
            <li>Visão Geral</li>
            <li>Receitas</li>
            <li>Gráficos</li>
            <li>Relatórios</li>
            <li>Metas</li>
            <li>Configurações</li>
          </ul>
        </nav>
      </aside>

      <main class="main">
        <div class="topbar">
          <h1>Olá</h1>
          <h3 id="receita-total">Receitas Totais: R$ 0</h3>
          <h3 id="despesa-total">Despesas Totais: R$ 0</h3>
          <h3 id="saldo">Saldo: R$ 0</h3>
        </div>

        <section class="grid">
          <article class="card">
            <h4>Receitas</h4>
            <div id="Adicionar-receita" class="form-inline">
              <input id="input-receita" type="number" placeholder="Valor" />
              <input
                id="descricao-receita"
                type="text"
                placeholder="Descrição"
              />
              <input id="data-receita" type="date" />
              <select id="categoria-receita"></select>
              <button id="btn-receita">Adicionar</button>
              <button id="btn-cancelar-receita">Cancelar</button>
            </div>
            <div id="lista-receita"></div>
          </article>

          <article class="card">
            <h4>Despesas</h4>
            <div id="Adicionar-despesa" class="form-inline">
              <input id="input-despesa" type="number" placeholder="Valor" />
              <input
                id="descricao-despesa"
                type="text"
                placeholder="Descrição"
              />
              <input id="data-despesa" type="date" />
              <select id="categoria-despesa"></select>
              <button id="btn-despesa">Adicionar</button>
              <button id="btn-cancelar-despesa">Cancelar</button>
            </div>
            <div id="lista-despesa"></div>
          </article>

          <article class="card">
            <h4>Histórico</h4>
            <input
              type="text"
              id="pesquisa-historico"
              placeholder="Pesquisar somente a descrição..."
            />
            <select id="filtro-historico"></select>

            <div id="historico">
              <!-- itens adicionados aparecem aqui -->
            </div>
          </article>

          <article class="card">
            <h4>Extras</h4>
            <p>Relatórios e metas</p>
          </article>
        </section>
        <section class="graficos" aria-label="Gráficos financeiros">
          <article class="card grafico-card">
            <h4>Receitas x Despesas</h4>
            <div class="grafico-container">
              <canvas id="grafico-receitas-despesas"></canvas>
            </div>
          </article>

          <article class="card grafico-card">
            <h4>Despesas por Categoria</h4>
            <div class="grafico-container">
              <canvas id="grafico-despesas-categoria"></canvas>
            </div>
          </article>

          <article class="card grafico-card grafico-evolucao">
            <h4>Evolução Mensal</h4>
            <div class="grafico-container">
              <canvas id="grafico-evolucao-mensal"></canvas>
            </div>
          </article>
        </section>
      </main>
    </div>
  </body>
</html>
